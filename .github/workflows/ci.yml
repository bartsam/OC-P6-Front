name: OPT CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    name: Run Tests & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        if: ${{ hashFiles('build.gradle') != '' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run unit tests
        run: bash ./run-tests.sh

      - name: Publish JUnit test report
        if: ${{ !cancelled() && hashFiles('test-results/**/*.xml') != '' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: test-results/**/*.xml
          fail_on_failure: false

      - name: Upload JUnit files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/**/*.xml
          if-no-files-found: warn

  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=long,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=pr-,format=long,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push Docker image
        id: push_docker_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push_docker_image.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out the repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run semantic-release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --package semantic-release@25
          --package @semantic-release/changelog
          --package @semantic-release/exec
          --package @semantic-release/git
          semantic-release

      - name: Log in to the Container registry
        if: ${{ steps.semantic_release.outputs.version != '' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image with release version
        if: ${{ steps.semantic_release.outputs.version != '' }}
        env:
          VERSION: ${{ steps.semantic_release.outputs.version }}
        run: |
          image_name="${IMAGE_NAME,,}"
          source_image="${REGISTRY}/${image_name}:main-${GITHUB_SHA}"
          target_image="${REGISTRY}/${image_name}:${VERSION}"

          docker pull "$source_image"
          docker tag "$source_image" "$target_image"
          docker push "$target_image"
